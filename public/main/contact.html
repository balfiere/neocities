<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>contact</title>
<link rel="shortcut icon" href="images/favicon.gif">

<!-- styling -->
<link rel="stylesheet" href="css/body.min.css" type="text/css">

<body>

    <article>

    <h1>contact</h1>

    <p>if you'd like to leave a quick note for me, feel free to comment on my <a target="_blank" href="https://neocities.org/site/kwaamfan">neocities profile</a> or say something in the chatbox to the right. if you want to discuss something more at length, you can also email me: <a href="" id="contact" onclick="showEmail(event)">click to show email</a>.</p>

    </article>

<!-- show email on click -->
<script>

function showEmail(event) {
    const form = document.getElementById("contact");
    if (form.getAttribute("href") == undefined) {
        event.preventDefault();        
    }
    var encEmail = "YmFsZmllcmVAcHJvdG9uLm1l";
    form.setAttribute("href", "mailto:".concat(atob(encEmail)));
    form.innerHTML = atob(encEmail);
}

</script>
</body>
</html>
