<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crafts</title>
    <link rel="stylesheet" href="crafts.min.css">
    <link rel="shortcut icon" href="favicon.gif">
    <link rel="alternate" title="ราวเหมือนดั่งความฝัน: updates" type="application/atom+xml" href="https://kwaamfan.neocities.org/atom.xml"/>
    <meta name="generator" content="{{ eleventy.generator }}">
</head>
<body>

    <main>

        <header>
            <h1>crafts</h1>
            <p>an assortment of stuff i’ve knitted, crocheted, sewed, etc.</p>
            <p>close modals by clicking outside the popup or pressing esc on your keyboard.</p>
            <p>for a more extensive list of things i've knit and crocheted see <a target="_blank" href="https://www.ravelry.com/projects/koikurasu">my ravelry</a>.</p>
            <p><button id="font-switcher">switch fonts?</button></p>
            <p><a href="/main/">go back?</a></p>
        </header>

        <div class="frill"></div>

        <div class="gallery-image">

            {% for fo in collections.crafts %}
            <section>
                <input class="modal-toggle" id="modal-{{ fo.page.fileSlug | slugify }}" type="checkbox" />
                <label class="modal-open" for="modal-{{ fo.page.fileSlug | slugify }}">
                    <div class="img-box">
                    <img src="{{ fo.data.image }}" alt="{{ fo.data.title }}" />
                    <div class="transparent-box">
                        <h2 class="caption">{{ fo.data.title }}</h2>
                    </div>
                    </div>
                </label>
                <div class="modal">
                    <label class="modal-close" for="modal-{{ fo.page.fileSlug | slugify }}"></label>
                    <div class="popup">
                        {{ fo.content }}
                    </div>
                </div>
            </section>
            {% endfor %}

        </div>

    </main>

</body>

<script src="./rough-notation.js" type="module"></script>
<script src="./script.min.js" type="module"></script>

</html>
