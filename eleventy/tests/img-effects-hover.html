<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image effects on hover</title>
    <!-- from https://codepen.io/MDJAmin/pen/yyYwPRg -->

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 50px;
            height: 100vh;
            margin: 0;
            flex-wrap: wrap;
            background-color: rgb(31, 31, 31);
        }

        section {
            width: 80%;
            max-width: 500px;
        }

        figure {
            display: grid;
            width: 100%;
            grid-template-rows: 100%;
            aspect-ratio: 0.9;
            box-sizing: border-box;
            cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.323));
        }

        figure>img:first-of-type {
            grid-area: 1/1;
            opacity: 0;
            translate: 0 -10%;
            inset: 0;
            transform-origin: bottom;
            filter: contrast(2) blur(10px);
            overflow: hidden;
            transition: 0.5s all ease;
            pointer-events: none;
            height: 100%;
            box-shadow: 10px 10px 0px rgb(0, 0, 0);
        }

        figure:hover>img:first-of-type {
            opacity: 1;
            transform: translateX(-75%);
            filter: contrast(1) blur(0px);
            /* transform: perspective(500px) rotateX(60deg); */
        }

        figure>img:last-of-type {
            grid-area: 1/1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            place-self: end center;
            transition: 0.5s all ease;
            filter: contrast(1) blur(0px) saturate(1) drop-shadow(10px 10px 0px rgba(0, 0, 0, 1));
            /* clip the bottom */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        figure:hover>img:last-of-type {
            width: 110%;
            height: 120%;
            filter: contrast(1.3) blur(1px) saturate(1.3) drop-shadow(10px 10px 5px rgba(0, 0, 0, 1));
            transform: translateX(5%);
            transition: 0.4s all ease;
        }

    </style>
</head>

<body>
    <section>
        <figure>
            <img
                src="https://raw.githubusercontent.com/MDJAmin/3D-Card-Game-Hover-Diablo-Inspired-Character-Gallery/main/assets/Images/necro-back.jpg" />
            <img src="https://raw.githubusercontent.com/MDJAmin/3D-Card-Game-Hover-Diablo-Inspired-Character-Gallery/main/assets/Images/necro.webp
" alt="Necromancer" />
        </figure>
    </section>
    <section>
        <figure>
            <img
                src="https://raw.githubusercontent.com/MDJAmin/3D-Card-Game-Hover-Diablo-Inspired-Character-Gallery/main/assets/Images/druid-back.jpg" />
            <img src="https://raw.githubusercontent.com/MDJAmin/3D-Card-Game-Hover-Diablo-Inspired-Character-Gallery/main/assets/Images/druide.webp
" alt="Druid" />
        </figure>
    </section>

</body>

</html>
